name: ci

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint, typecheck, build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # `prisma generate` only needs a syntactically valid URL; nothing connects.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      # Corepack must be enabled before setup-node so `cache: yarn` can find it.
      # The Yarn version comes from `packageManager` / `.yarnrc.yml` (Yarn 4).
      - name: Enable Yarn through Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate Prisma client
        run: yarn db:generate

      # Non-mutating on purpose: `yarn lint` runs `--fix`, which would repair
      # formatting errors inside CI and report green. --max-warnings is a
      # ratchet: lower it as warnings are cleaned up, never raise it.
      - name: Lint
        run: yarn lint:ci

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      # Full suite (about a minute): the previous changed-files filter skipped
      # tests for changes outside src/ and for dependents of a changed module.
      - name: Test
        run: yarn test --ci
